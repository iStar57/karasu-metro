<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Karasu Metro</title>
  <style>
    @font-face {
      font-family: Geist;
      font-weight: 100 900;
      src: url("fonts/geist-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: Michroma;
      src: url("fonts/michroma-latin.woff2") format("woff2");
    }

    :root {
      --accent: #38e1ff;
      --bg: #0b0b0b;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f1f1f1;
      --text-2: #a7a7a7;
      --text-3: #6b6b6b;
    }
    * { box-sizing: border-box; }
    html { overflow: hidden; background: var(--bg); }
    body {
      margin: 0;
      width: 300px;
      padding: 18px 18px 14px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 Geist, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Cabecera: marca, estado e interruptor en una fila ---------- */
    .top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
    }
    .mark { display: block; width: 30px; height: 30px; }
    .mark .eye { fill: var(--accent); }
    h1 {
      margin: 0;
      font: 400 11px/1.3 Michroma, Geist, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .meta { margin: 3px 0 0; color: var(--text-3); font-size: 11.5px; white-space: nowrap; }
    #status-text { color: var(--text-2); font-weight: 600; }
    body:not(.off) #status-text { color: var(--accent); }

    /* Interruptor plano */
    .switch { position: relative; display: block; width: 34px; height: 20px; }
    .switch input { position: absolute; inset: 0; z-index: 1; margin: 0; opacity: 0; cursor: pointer; }
    .track { position: absolute; inset: 0; border-radius: 999px; background: #2b2b2b; transition: background 0.18s ease; }
    .track::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f1f1f1;
      transition: translate 0.18s ease;
    }
    input:checked + .track { background: var(--accent); }
    input:checked + .track::before { translate: 14px 0; background: #0b0b0b; }
    input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Bloques separados por una línea fina ---------- */
    .block { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    body.off .dep { opacity: 0.4; }

    .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
    .head span:first-child { font-weight: 600; }
    .hex { color: var(--text-3); font: 500 11px ui-monospace, "Cascadia Mono", monospace; letter-spacing: 0.04em; }

    /* 7 colores repartidos exactamente en el ancho */
    .swatches { display: flex; justify-content: space-between; }
    .sw {
      position: relative;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--c);
      cursor: pointer;
      transition: box-shadow 0.15s ease;
    }
    .sw:hover { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--text-3); }
    .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--text); }
    .sw.custom { background: conic-gradient(#ff3b3b, #ffd23b, #3bff6e, #3bd8ff, #6b3bff, #ff3bd2, #ff3b3b); }
    .sw.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .row b { font-weight: 600; }
    #notices-count { margin-left: 6px; color: var(--text-3); }

    /* Acciones como enlaces de texto */
    .link {
      padding: 0;
      border: 0;
      background: none;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .link:hover:not(:disabled) { color: var(--text); }
    .link:disabled { opacity: 0.35; cursor: default; }
    #notices-reset { color: var(--accent); }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .saved { color: var(--text-3); font-size: 11.5px; transition: color 0.2s ease; }
    .saved.on { color: #6ade43; }
  </style>
</head>
<body>
  <header class="top">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <polygon points="4,12 9,6 17,4.5 22,7.5 18.5,12.5" fill="#f1f3f5"/>
      <polygon points="22,7.5 30,11.5 18.5,12.5" fill="#d9dde2"/>
      <polygon points="18.5,12.5 30,11.5 20,15" fill="#8a9099"/>
      <polygon points="4,12 18.5,12.5 20,15 13,20" fill="#b9bfc7"/>
      <polygon points="13,20 20,15 17.5,22.5 14.5,21" fill="#6e747d"/>
      <polygon points="13,20 14.5,24 11,22.5 9.5,27 8.5,22" fill="#575c64"/>
      <polygon points="4,12 13,20 8.5,22 3,30 5,18" fill="#9aa1aa"/>
      <circle class="eye" cx="15" cy="9.2" r="1.1"/>
    </svg>
    <div>
      <h1>Karasu Metro</h1>
      <p class="meta"><span id="status-text">Active</span> · <span data-i18n="subtitle">for karasu.live</span></p>
    </div>
    <label class="switch" data-i18n-title="enable" title="Enable theme">
      <input type="checkbox" id="enabled" data-i18n-aria="enable" aria-label="Enable theme">
      <span class="track"></span>
    </label>
  </header>

  <section class="block dep">
    <div class="head">
      <span data-i18n="accent">Accent color</span>
      <span class="hex" id="hex">#38E1FF</span>
    </div>
    <div class="swatches" role="group" aria-label="Accent color">
      <button class="sw" type="button" style="--c:#38e1ff" data-c="#38e1ff" data-i18n-title="cyan" data-i18n-aria="cyan"></button>
      <button class="sw" type="button" style="--c:#ff4b00" data-c="#ff4b00" data-i18n-title="orange" data-i18n-aria="orange"></button>
      <button class="sw" type="button" style="--c:#ff2d55" data-c="#ff2d55" data-i18n-title="crimson" data-i18n-aria="crimson"></button>
      <button class="sw" type="button" style="--c:#f5b700" data-c="#f5b700" data-i18n-title="gold" data-i18n-aria="gold"></button>
      <button class="sw" type="button" style="--c:#22d36b" data-c="#22d36b" data-i18n-title="emerald" data-i18n-aria="emerald"></button>
      <button class="sw" type="button" style="--c:#a24bff" data-c="#a24bff" data-i18n-title="violet" data-i18n-aria="violet"></button>
      <label class="sw custom" id="custom" data-i18n-title="custom" data-i18n-aria="custom">
        <input type="color" id="accent">
      </label>
    </div>
  </section>

  <section class="block row" id="notices" hidden>
    <span><b data-i18n="dismissed">Dismissed notices</b><span id="notices-count">0 hidden</span></span>
    <button class="link" id="notices-reset" type="button" data-i18n="show">Show</button>
  </section>

  <footer>
    <button class="link" id="reset" type="button" data-i18n-title="resetHint"><span data-i18n="reset">Reset</span></button>
    <span class="saved" id="saved"><span id="saved-text" data-i18n="instant">Applies instantly</span></span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
